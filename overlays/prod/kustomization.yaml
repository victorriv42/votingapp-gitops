apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vote-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod
    includeSelectors: false

replicas:
  - name: vote
    count: 2

configMapGenerator:
  - name: vote-config
    behavior: merge
    literals:
      - OPTION_A=Chats
      - OPTION_B=Chiens

patches:
  - path: ingress-hosts.yaml
    target:
      kind: Ingress
      name: voting-app
