apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vote-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: false

replicas:
  - name: vote
    count: 1

# Fusion avec le générateur de la base : mêmes clés, valeurs propres à dev
configMapGenerator:
  - name: vote-config
    behavior: merge
    literals:
      - OPTION_A=Chats (dev)
      - OPTION_B=Chiens (dev)

patches:
  - path: ingress-hosts.yaml
    target:
      kind: Ingress
      name: voting-app
